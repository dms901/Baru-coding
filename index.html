    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .option-btn { transition: all 0.2s; border-width: 2px; }
        .option-correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .option-wrong { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .num-dot { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 10px; font-weight: 800; transition: all 0.2s; cursor: pointer; flex-shrink: 0; }
        .dot-unfilled { background-color: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }
        .dot-correct { background-color: #22c55e; color: white; border-color: #22c55e; }
        .dot-wrong { background-color: #ef4444; color: white; border-color: #ef4444; }
        .dot-active { border: 2px solid #6366f1; transform: scale(1.1); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }
        .custom-scroll::-webkit-scrollbar { height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen pb-32">

                    <div class="p-2 max-h-80 overflow-y-auto" id="dropdownList"></div>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <div class="flex items-center gap-1.5 bg-red-50 px-3 py-1.5 rounded-xl border border-red-100">

    <main class="w-full max-w-md px-6 mt-6" onclick="closeDropdown()">

        <div class="bg-white rounded-[3rem] shadow-xl shadow-slate-200/40 border border-white p-14 flex flex-col items-center mb-8">
            <div id="kanjiQuestion" class="text-7xl font-extrabold text-slate-900">?</div>
            <div id="statusBadge" class="mt-8 px-5 py-1.5 rounded-full bg-slate-50 text-[9px] font-black text-slate-400 uppercase tracking-widest">Belum Diisi</div>
        </div>

        <div id="optionsContainer" class="space-y-3"></div>

        <div id="explanationArea" class="hidden mt-8 p-8 bg-slate-900 rounded-[2.5rem] text-white mb-10">
            <p id="explanationText" class="text-sm text-slate-300 leading-relaxed font-medium"></p>
        </div>
    </main>

                {k:"彼", r:"かれ", m:"Dia (Laki)", e:"Kata ganti pria."},
                {k:"彼女", r:"かのじょ", m:"Dia (Wanita)", e:"Pacar/wanita."},
                {k:"親", r:"おや", m:"Orang Tua", e:"Ayah atau Ibu."},
                {k:"招待", r:"しょうたい", m:"Undangan", e:"Mengajak ke acara."},
                {k:"丁寧", r:"ていねい", m:"Sopan", e:"Sikap yang baik."},
                {k:"最後", r:"さいご", m:"Terakhir", e:"Paling ujung."},
                {k:"最高", r:"さいこう", m:"Terbaik", e:"Sangat luar biasa."},
                {k:"最低", r:"さいてい", m:"Terburuk", e:"Paling rendah."},
                {k:"最悪", r:"さいあく", m:"Paling Buruk", e:"Situasi parah."},
                {k:"池", r:"いけ", m:"Kolam", e:"Genangan air kecil."},
                {k:"旅", r:"たび", m:"Perjalanan", e:"Traveling."},
                {k:"林", r:"はやし", m:"Hutan Kecil", e:"Kumpulan pohon."},
                {k:"力", r:"ちから", m:"Kekuatan", e:"Power/tenaga."},
                {k:"祖母", r:"そぼ", m:"Nenek", e:"Ibu dari orang tua."},
                {k:"祖父", r:"そふ", m:"Kakek", e:"Ayah dari orang tua."},
                {k:"泊まる", r:"とまる", m:"Menginap", e:"Tidur di hotel/rumah."},
                {k:"自己紹介", r:"じこしょうかい", m:"Perkenalan", e:"Mengenalkan diri."},
                {k:"熱い", r:"あつい", m:"Panas", e:"Suhu benda."},
                {k:"厚い", r:"あつい", m:"Tebal", e:"Dimensi benda."},
                {k:"喜ぶ", r:"よろこぶ", m:"Senang", e:"Merasa gembira."},
                {k:"成長", r:"せいちょう", m:"Pertumbuhan", e:"Menjadi besar."},
                {k:"若い", r:"わかい", m:"Muda", e:"Usia belum tua."},
                {k:"帰国", r:"きこく", m:"Pulang Negara", e:"Kembali ke asal."},
                {k:"薬局", r:"やっきょく", m:"Apotek", e:"Toko obat."},
                {k:"人形", r:"にんぎょう", m:"Boneka", e:"Mainan orang-orang."}
            ]
        };

        // Fill remaining parts (6-14) with placeholders
        for(let n=6; n<=14; n++) {
            allData[n] = Array.from({length: 35}, (_, i) => ({
                k: `P${n}`, r: `?`, m: `Bagian ${n} Soal ${i+1}`, e: `Belum ada data.`
            }));
        }

        let currentPart = 1, quizData = [], currentIndex = 0, lives = 10, score = 0, userAnswers = new Array(35).fill(null), currentOptions = [];

        function initDropdown() {
            const list = document.getElementById('dropdownList');
            list.innerHTML = '';
            for(let i=1; i<=14; i++) {
                const btn = document.createElement('button');
                const isActive = (i === currentPart);
                btn.className = `w-full text-left px-5 py-4 text-xs font-bold border-b border-slate-50 transition-colors ${isActive ? 'bg-indigo-50 text-indigo-600' : 'text-slate-500 hover:bg-slate-50'}`;
                btn.innerHTML = `<div class="flex justify-between"><span>Bagian ${i}</span>${isActive ? '<span>●</span>' : ''}</div>`;
                btn.onclick = () => {
                    currentPart = i;
                    document.getElementById('currentPartTitle').innerText = "Bagian " + i;
                    initDropdown(); 
                    closeDropdown();
                    restartGame();
                };
                list.appendChild(btn);
            }
        }

        function toggleDropdown(e) { e.stopPropagation(); document.getElementById('partDropdown').classList.toggle('hidden'); }
        function closeDropdown() { document.getElementById('partDropdown').classList.add('hidden'); }

        function renderNumberGrid() {
            const grid = document.getElementById('numberGrid');
            grid.innerHTML = '';
            for(let i=0; i<35; i++) {
                const dot = document.createElement('div');
                let sc = userAnswers[i] === 'correct' ? 'dot-correct' : (userAnswers[i] === 'wrong' ? 'dot-wrong' : 'dot-unfilled');
                dot.className = `num-dot ${sc} ${i === currentIndex ? 'dot-active' : ''}`;
                dot.innerText = i + 1;
                dot.onclick = () => { currentIndex = i; loadQuestion(true); };
                grid.appendChild(dot);
            }
        }

        function restartGame() {
            quizData = [...allData[currentPart]];
            currentIndex = 0; lives = 10; score = 0;
            userAnswers = new Array(35).fill(null);
            document.getElementById('livesText').innerText = lives;
            loadQuestion(true);
        }

        function loadQuestion(isNew) {
            renderNumberGrid();
            const item = quizData[currentIndex];
            if(isNew) {
                let opts = [{ r: item.r, m: item.m, correct: true }];
                let others = quizData.filter(i => i.r !== item.r).sort(() => Math.random() - 0.5);
                for(let i=0; i<3; i++) { if(others[i]) opts.push({ r: others[i].r, m: others[i].m, correct: false }); }
                currentOptions = opts.sort(() => Math.random() - 0.5);
                document.getElementById('kanjiQuestion').innerText = item.k;
            }
            
            const badge = document.getElementById('statusBadge');
            const exp = document.getElementById('explanationArea');
            if(userAnswers[currentIndex] === null) {
                badge.innerText = "Belum Diisi"; badge.className = "mt-8 px-5 py-1.5 rounded-full bg-slate-50 text-[9px] font-black text-slate-400 uppercase tracking-widest";
                exp.classList.add('hidden');
            } else {
                const isC = userAnswers[currentIndex] === 'correct';
                badge.innerText = isC ? "Benar" : "Salah";
                badge.className = `mt-8 px-5 py-1.5 rounded-full ${isC ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'} text-[9px] font-black uppercase tracking-widest`;
                document.getElementById('explanationText').innerText = item.e;
                exp.classList.remove('hidden');
            }

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            currentOptions.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-5 bg-white border-slate-100 rounded-2xl flex justify-between items-center text-left shadow-sm";
                if(userAnswers[currentIndex] !== null) {
                    if(opt.correct) btn.classList.add('option-correct');
                    if(userAnswers[currentIndex] === 'wrong' && opt.clicked) btn.classList.add('option-wrong');
                }
                btn.innerHTML = `<div><div class="text-sm font-black text-slate-800">${opt.r}</div><div class="text-[9px] font-bold text-slate-400 uppercase">${opt.m}</div></div>`;
                btn.onclick = () => {
                    if(userAnswers[currentIndex] !== null) return;
                    opt.clicked = true;
                    if(opt.correct) { userAnswers[currentIndex] = 'correct'; score += 10; }
                    else { userAnswers[currentIndex] = 'wrong'; lives--; document.getElementById('livesText').innerText = lives; }
                    loadQuestion(false);
                };
                container.appendChild(btn);
            });
        }

        function nextQuestion() { if(currentIndex < 34) { currentIndex++; loadQuestion(true); } }
        function prevQuestion() { if(currentIndex > 0) { currentIndex--; loadQuestion(true); } }

        window.onload = () => { 
            initDropdown(); 
            restartGame();
        };
    </script>
</body>
</html>
