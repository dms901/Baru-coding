<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlashCard Kanji N5-N4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcfcfd;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shadow-premium {
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.05);
        }

        .dropdown-content {
            transform-origin: top;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        @keyframes shuffle-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05) rotate(2deg); }
            100% { transform: scale(1); }
        }
        .animate-shuffle { animation: shuffle-pop 0.4s ease-out; }

        .active-part {
            background: #fef2f2;
            color: #ef4444;
            border-left: 4px solid #ef4444;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen">

    <!-- Header -->
    <header class="w-full max-w-md sticky top-0 bg-[#fcfcfd]/90 backdrop-blur-md z-50 border-b border-slate-100">
        <div class="flex justify-between items-center px-6 py-4">
            <div class="flex flex-col relative">
                <h1 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">Master Kanji</h1>
                
                <!-- Modern Dropdown Trigger -->
                <button onclick="toggleDropdown(event)" id="dropdownBtn" class="flex items-center gap-2 text-lg font-extrabold text-slate-900 group">
                    <span id="currentPartTitle">Bagian 1</span>
                    <div class="w-5 h-5 flex items-center justify-center rounded-full bg-slate-100 group-active:bg-red-100 transition-colors">
                        <svg id="dropdownArrow" class="transition-transform duration-300" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </button>

                <!-- Modern Dropdown Menu -->
                <div id="partDropdown" class="absolute top-full left-0 mt-3 w-56 bg-white rounded-3xl shadow-2xl border border-slate-50 hidden opacity-0 -translate-y-4 dropdown-content overflow-hidden z-[60]">
                    <div class="p-2 max-h-[400px] overflow-y-auto custom-scroll" id="dropdownList">
                        <!-- Items injected via JS -->
                    </div>
                </div>
            </div>
            
            <button onclick="togglePreview()" class="w-11 h-11 flex items-center justify-center bg-white border border-slate-200 rounded-2xl shadow-sm active:scale-90 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </button>
        </div>
    </header>

    <main class="w-full max-w-md px-6 pb-20 pt-8" onclick="closeDropdown()">
        
        <!-- Progress Bar -->
        <div class="mb-10 px-1">
            <div class="flex justify-between items-end mb-3">
                <div class="flex flex-col">
                    <span id="counterText" class="text-xs font-black text-slate-900 leading-none">0 / 0</span>
                    <span class="text-[8px] font-bold text-slate-400 uppercase mt-1">Hafalan Saat Ini</span>
                </div>
                <span id="percentageText" class="text-[10px] font-black text-red-500 bg-red-50 px-2 py-0.5 rounded-md">0%</span>
            </div>
            <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-red-500 transition-all duration-700 ease-out shadow-[0_0_10px_rgba(239,68,68,0.3)]" style="width: 0%"></div>
            </div>
        </div>

        <!-- Flashcard -->
        <div id="flashcard" class="perspective-1000 w-full aspect-[4/4.8] cursor-pointer" onclick="flipCard()">
            <div id="cardInner" class="card-inner relative w-full h-full preserve-3d">
                <!-- Depan -->
                <div class="absolute inset-0 backface-hidden bg-white rounded-[3rem] shadow-premium border border-slate-50 flex flex-col items-center justify-center p-8 text-center">
                    <div id="kanjiDisplay" class="text-6xl text-slate-900 tracking-tighter">...</div>
                    <div class="absolute bottom-10 flex flex-col items-center">
                        <div class="w-1 h-1 bg-red-500 rounded-full mb-2"></div>
                        <span class="text-[9px] font-bold text-slate-300 uppercase tracking-[0.3em]">Lihat Arti</span>
                    </div>
                </div>
                <!-- Belakang -->
                <div class="absolute inset-0 backface-hidden bg-white rounded-[3rem] shadow-premium border-4 border-red-50 rotate-y-180 flex flex-col items-center justify-center p-8 text-center overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-b from-red-50/50 to-transparent"></div>
                    <div id="readingDisplay" class="text-3xl font-black text-red-500 mb-3 leading-tight z-10">...</div>
                    <div id="meaningDisplay" class="text-2xl font-semibold text-slate-600 leading-tight z-10 px-4">...</div>
                    <div class="absolute bottom-10 w-12 h-1 bg-slate-100 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="mt-12 flex items-center justify-between px-4">
            <button onclick="prevCard()" class="w-14 h-14 flex items-center justify-center bg-white border border-slate-100 rounded-[1.5rem] shadow-sm text-slate-400 active:scale-90 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            
            <button onclick="shuffleCurrentPart()" class="w-16 h-16 flex items-center justify-center bg-slate-900 rounded-[1.8rem] shadow-xl text-white active:scale-95 transition-all group">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-active:rotate-45 transition-transform"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
            </button>

            <button onclick="nextCard()" class="w-14 h-14 flex items-center justify-center bg-red-500 rounded-[1.5rem] shadow-lg shadow-red-100 text-white active:scale-90 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </div>
    </main>

    <!-- List Modal -->
    <div id="previewModal" class="fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-md hidden items-end sm:items-center justify-center p-4" onclick="togglePreview()">
        <div class="bg-white w-full max-w-md h-[80vh] rounded-[3rem] shadow-2xl flex flex-col overflow-hidden transition-transform duration-500 translate-y-full" id="modalBox" onclick="event.stopPropagation()">
            <div class="p-8 flex justify-between items-center border-b border-slate-50">
                <div>
                    <h2 class="font-extrabold text-slate-900 text-xl tracking-tight">Koleksi Kanji</h2>
                    <p id="modalSub" class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">Bagian 1</p>
                </div>
                <button onclick="togglePreview()" class="w-10 h-10 flex items-center justify-center bg-slate-50 rounded-full text-slate-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modalContent" class="flex-1 overflow-y-auto p-6 space-y-3 custom-scroll"></div>
        </div>
    </div>

        let currentPart = 1;
        let currentData = [...allData[1]];
        let currentIndex = 0;
        let flipped = false;

        function initDropdown() {
            const list = document.getElementById('dropdownList');
            list.innerHTML = '';
            for(let i=1; i<=40; i++) {
                const btn = document.createElement('button');
                btn.className = `w-full flex items-center justify-between px-4 py-3.5 text-xs font-bold rounded-2xl transition-all mb-1 last:mb-0 ${i === currentPart ? 'active-part' : 'text-slate-500 hover:bg-slate-50'}`;
                btn.innerHTML = `
                    <span>Bagian ${i}</span>
                    ${allData[i].length > 0 ? `<span class="text-[8px] bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded-md">${allData[i].length}</span>` : ''}
                `;
                btn.onclick = () => { switchPart(i); closeDropdown(); };
                list.appendChild(btn);
            }
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            const dd = document.getElementById('partDropdown');
            const arrow = document.getElementById('dropdownArrow');
            if(dd.classList.contains('hidden')) {
                dd.classList.remove('hidden');
                setTimeout(() => {
                    dd.classList.replace('opacity-0', 'opacity-100');
                    dd.classList.replace('-translate-y-4', 'translate-y-0');
                    arrow.style.transform = 'rotate(180deg)';
                }, 10);
            } else {
                closeDropdown();
            }
        }

        function closeDropdown() {
            const dd = document.getElementById('partDropdown');
            const arrow = document.getElementById('dropdownArrow');
            dd.classList.replace('opacity-100', 'opacity-0');
            dd.classList.replace('translate-y-0', '-translate-y-4');
            arrow.style.transform = 'rotate(0deg)';
            setTimeout(() => dd.classList.add('hidden'), 300);
        }

        function switchPart(n) {
            currentPart = n;
            currentData = allData[n].length > 0 ? [...allData[n]] : [{k:"?", r:"Belum Ada Data", m:"Part " + n + " Masih Kosong"}];
            currentIndex = 0;
            document.getElementById('currentPartTitle').innerText = "Bagian " + n;
            initDropdown();
            render();
        }

        function render() {
            const item = currentData[currentIndex];
            document.getElementById('kanjiDisplay').innerText = item.k;
            document.getElementById('readingDisplay').innerText = item.r;
            document.getElementById('meaningDisplay').innerText = item.m;
            
            document.getElementById('counterText').innerText = `${currentIndex + 1} / ${currentData.length}`;
            const perc = currentData.length > 0 ? Math.round(((currentIndex + 1) / currentData.length) * 100) : 0;
            document.getElementById('progressBar').style.width = `${perc}%`;
            document.getElementById('percentageText').innerText = `${perc}%`;
            resetFlip();
        }

        function shuffleCurrentPart() {
            if(currentData.length <= 1) return;
            const card = document.getElementById('flashcard');
            card.classList.add('animate-shuffle');
            setTimeout(() => card.classList.remove('animate-shuffle'), 400);

            for (let i = currentData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentData[i], currentData[j]] = [currentData[j], currentData[i]];
            }
            currentIndex = 0;
            render();
        }

        function flipCard() { flipped = !flipped; document.getElementById('cardInner').classList.toggle('rotate-y-180', flipped); }
        function resetFlip() { flipped = false; document.getElementById('cardInner').classList.remove('rotate-y-180'); }
        function nextCard() { currentIndex = (currentIndex + 1) % currentData.length; render(); }
        function prevCard() { currentIndex = (currentIndex - 1 + currentData.length) % currentData.length; render(); }

        function togglePreview() {
            const modal = document.getElementById('previewModal');
            const box = document.getElementById('modalBox');
            const content = document.getElementById('modalContent');
            if(modal.classList.contains('hidden')) {
                document.getElementById('modalSub').innerText = `Bagian ${currentPart} • ${currentData.length} Item`;
                content.innerHTML = currentData.map((item, idx) => `
                    <div onclick="jumpTo(${idx})" class="group flex items-center justify-between p-5 rounded-[2rem] cursor-pointer border-2 transition-all ${currentIndex === idx ? 'bg-red-50 border-red-100' : 'bg-white border-slate-50 hover:border-slate-100'}">
                        <div class="flex items-center gap-5">
                            <span class="text-3xl text-slate-900">${item.k}</span>
                            <div class="flex flex-col">
                                <span class="text-xs font-black text-slate-800 uppercase tracking-tight">${item.m}</span>
                                <span class="text-[10px] font-bold text-slate-400 mt-0.5">${item.r}</span>
                            </div>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-red-400"><path d="m9 18 6-6-6-6"/></svg>
                        </div>
                    </div>
                `).join('');
                modal.classList.remove('hidden');
                setTimeout(() => box.classList.replace('translate-y-full', 'translate-y-0'), 10);
            } else {
                box.classList.replace('translate-y-0', 'translate-y-full');
                setTimeout(() => modal.classList.add('hidden'), 500);
            }
        }

        function jumpTo(idx) { currentIndex = idx; render(); togglePreview(); }

        window.onload = () => { initDropdown(); render(); };
    </script>
